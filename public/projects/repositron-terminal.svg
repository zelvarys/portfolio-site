<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
  <title id="title">Repositron terminal overview</title>
  <desc id="desc">A dark terminal window showing the Repositron repository dashboard with health, activity, dependencies, contributor concentration, tool adoption, and CI cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090b"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="80%">
      <stop stop-color="#1d4ed8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="629" rx="18" fill="url(#bg)" stroke="#27272a" filter="url(#shadow)"/>
  <rect x="0.5" y="0.5" width="999" height="629" rx="18" fill="url(#topGlow)"/>
  <path d="M1 46H999" stroke="#1c1c1f"/>
  <circle cx="28" cy="23" r="6" fill="#3f3f46"/>
  <circle cx="48" cy="23" r="6" fill="#3f3f46"/>
  <circle cx="68" cy="23" r="6" fill="#3f3f46"/>
  <text x="500" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#71717a">~ repositron</text>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
